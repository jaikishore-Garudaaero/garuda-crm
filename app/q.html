<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garuda Aerospace · Enquiry</title>
<meta name="theme-color" content="#005aa9">
<meta name="robots" content="noindex">
<link rel="icon" href="img/ga-logo-blue.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  body{min-height:100vh}
  .qf{max-width:560px;margin:4vh auto 6vh;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
  .qf h1{font-size:22px;margin:4px 0 0;line-height:1.25}
  .qf .lead{margin:0;color:var(--ink2);font-size:14.5px}
  .qf label{font-weight:600;font-size:13.5px;display:block;margin-bottom:5px}
  .qf label small{font-weight:500;color:var(--ink3,#7a8597)}
  .qf input,.qf textarea{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--hair);background:var(--glass-strong);font:inherit;font-size:15px;box-sizing:border-box}
  .qf .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .svc{display:flex;flex-wrap:wrap;gap:8px}
  .svc button{border:1px solid var(--hair);background:var(--glass-strong);border-radius:999px;padding:9px 13px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left;color:inherit}
  .svc button[aria-pressed="true"]{background:var(--accent,#005aa9);border-color:var(--accent,#005aa9);color:#fff}
  .ref{border:1px dashed var(--hair);border-radius:12px;padding:12px}
  .ref summary{cursor:pointer;font-weight:600;font-size:14px}
  .ref[open] summary{margin-bottom:10px}
  .err{color:var(--bad);font-size:13.5px;min-height:18px;margin:0}
  .go{width:100%;padding:13px;font-size:16px}
  .fine{font-size:12px;color:var(--ink3,#7a8597);margin:0}
  .done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
  .done .tick{width:58px;height:58px;border-radius:50%;background:var(--good);color:#fff;font-size:30px;display:grid;place-items:center}
  .done .acts{display:flex;flex-direction:column;gap:9px;width:100%}
  .done .acts a{text-align:center;text-decoration:none;justify-content:center;white-space:normal;line-height:1.3}
  .hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
  .camp{align-self:flex-start;display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--hair)}
  @media (max-width:480px){.qf{margin:0 auto;border-radius:0;min-height:100vh}.qf .row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="glass qf" id="qf" aria-live="polite"><div class="brand"><img src="img/ga-logo-blue.png" alt="Garuda Aerospace" style="width:44px;height:auto;flex:none"><div><b>Garuda Aerospace</b><span>Enquiry</span></div></div><p class="muted">Loading…</p></main>
<script src="config.js"></script>
<script>
'use strict';
(function () {
  const cfg = window.GARUDA_CONFIG || {};
  const root = document.getElementById('qf');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brand = '<div class="brand"><img src="img/ga-logo-blue.png" alt="Garuda Aerospace" style="width:44px;height:auto;flex:none"><div><b>Garuda Aerospace</b><span>India\'s drone company · DGCA-approved RPTO</span></div></div>';
  const code = new URLSearchParams(location.search).get('c') || '';
  const base = (cfg.supabaseUrl || '').replace(/\/$/, '') + '/rest/v1/rpc/';
  const headers = { 'Content-Type': 'application/json', apikey: cfg.supabaseAnonKey || '', Authorization: 'Bearer ' + (cfg.supabaseAnonKey || '') };
  const show = (html) => { root.innerHTML = brand + html; };
  const call = async (fn, body) => {
    const r = await fetch(base + fn, { method: 'POST', headers, body: JSON.stringify(body) });
    const j = await r.json().catch(() => null);
    if (!r.ok) throw new Error((j && (j.message || j.hint)) || 'Something went wrong. Please try again.');
    return j;
  };
  const thanks = (again) => show(`<div class="done"><div class="tick">✓</div><h1>${again ? 'We already have your details' : 'Thank you! We have your details'}</h1>
      <p class="lead">Our team will call you shortly. Meanwhile, take a look at what Garuda Aerospace does.</p>
      <div class="acts"><a class="btn primary go" href="garuda.html">See what Garuda Aerospace does</a>
      <a class="btn" href="https://wa.me/917788868884" target="_blank" rel="noopener">WhatsApp us · +91 77888 68884</a>
      <a class="btn" href="tel:+917824833884">Call · +91 78248 33884</a></div></div>`);

  if (!cfg.supabaseUrl) return show('<h1>Enquiry form</h1><p class="muted">This form goes live once the CRM is connected.</p>');
  if (!code) return show('<h1>Scan the QR code again</h1><p class="lead">This link is missing its campaign code. Please scan the QR code once more.</p>');

  call('qr_info', { p_code: code }).then((info) => {
    if (!info) return show('<h1>This QR code is not active</h1><p class="lead">Please ask our team for the latest QR code, or <a href="garuda.html">see what we do</a>.</p>');
    if (!info.active) return show(`<h1>${esc(info.name)} has ended</h1><p class="lead">Thank you for your interest. You can still reach us on <a href="tel:+917824833884">+91 78248 33884</a>, or <a href="garuda.html">see what we do</a>.</p>`);
    const svcs = Array.isArray(info.services) ? info.services : [];
    const sel = new Set();
    show(`<span class="camp">${esc(info.name)}</span>
      <h1>Tell us what you're looking for</h1>
      <p class="lead">Leave your details and our team will call you back.</p>
      <form id="f" novalidate>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div><label for="n">Full name</label><input id="n" autocomplete="name" required maxlength="120"></div>
          <div class="row"><div><label for="p">Mobile number</label><input id="p" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile" required maxlength="16"></div>
          <div><label for="e">Email <small>(optional)</small></label><input id="e" type="email" autocomplete="email" maxlength="160"></div></div>
          <div><label for="c">City <small>(optional)</small></label><input id="c" autocomplete="address-level2" maxlength="80"></div>
          <div><label>I'm interested in <small>(choose one or more)</small></label><div class="svc" id="svc">${svcs.map((s, i) => `<button type="button" data-i="${i}" aria-pressed="false">${esc(s.label)}</button>`).join('')}</div></div>
          <div id="orgw" hidden><label for="o">College / company name</label><input id="o" autocomplete="organization" maxlength="160"></div>
          <details class="ref" id="refw"><summary>Referred by someone? Add their details</summary>
            <div class="row"><div><label for="rn">Their name</label><input id="rn" maxlength="120"></div><div><label for="rp">Their mobile</label><input id="rp" type="tel" inputmode="numeric" maxlength="16"></div></div></details>
          <div><label for="m">Anything else? <small>(optional)</small></label><textarea id="m" rows="2" maxlength="300"></textarea></div>
          <div class="hp" aria-hidden="true"><label for="w">Website</label><input id="w" tabindex="-1" autocomplete="off"></div>
          <p class="err" id="err"></p>
          <button class="btn primary go" id="go" type="submit">Send my details</button>
          <p class="fine">By sending, you agree that Garuda Aerospace may call, WhatsApp or email you about your enquiry.</p>
        </div>
      </form>`);
    const $ = (id) => document.getElementById(id);
    $('svc').addEventListener('click', (ev) => {
      const b = ev.target.closest('button[data-i]'); if (!b) return;
      const i = +b.dataset.i; if (sel.has(i)) sel.delete(i); else sel.add(i);
      b.setAttribute('aria-pressed', String(sel.has(i)));
      $('orgw').hidden = ![...sel].some((k) => svcs[k] && svcs[k].org);
    });
    $('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const err = $('err'); err.textContent = '';
      const phone = $('p').value.replace(/\D/g, '').slice(-10);
      if ($('n').value.trim().length < 2) { err.textContent = 'Please enter your name.'; return $('n').focus(); }
      if (!/^[6-9]\d{9}$/.test(phone)) { err.textContent = 'Please enter a valid 10-digit mobile number.'; return $('p').focus(); }
      if (!sel.size) { err.textContent = 'Please choose what you are looking for.'; return; }
      $('go').disabled = true; $('go').textContent = 'Sending…';
      try {
        const r = await call('qr_submit', { p_code: code, p_name: $('n').value, p_phone: $('p').value, p_email: $('e').value, p_services: [...sel].map((k) => svcs[k].label),
          p_org: $('o').value, p_city: $('c').value, p_ref_name: $('rn').value, p_ref_phone: $('rp').value, p_note: $('m').value, p_hp: $('w').value });
        thanks(r && r.again);
      } catch (e) { err.textContent = e.message; $('go').disabled = false; $('go').textContent = 'Send my details'; }
    });
  }).catch((e) => show(`<h1>Could not load the form</h1><p class="lead">${esc(e.message)}. Please check your internet and scan again.</p>`));
})();
</script>
</body>
</html>
