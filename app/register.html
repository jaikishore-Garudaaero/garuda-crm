<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Webinar registration · Garuda Aerospace</title>
<meta name="theme-color" content="#005aa9">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .reg{max-width:560px;margin:5vh auto;padding:26px;display:flex;flex-direction:column;gap:14px}
  .reg h1{font-size:23px}
  .reg .when{display:flex;gap:8px;flex-wrap:wrap}
  .reg .price{font-family:var(--f-display);font-size:20px;font-weight:600}
  .reg input,.reg select{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--hair);background:var(--glass-strong)}
  .reg .done{text-align:center;padding:10px 0}
  .reg .done .tick{width:54px;height:54px;border-radius:50%;margin:0 auto 10px;background:var(--good);color:#fff;font-size:28px;display:grid;place-items:center;border:0}
  .err{color:var(--bad);font-size:13px;min-height:18px}
</style>
</head>
<body>
<main class="glass reg" id="reg" aria-live="polite"><div class="brand"><div class="mark">G</div><div><b>Garuda Aerospace</b><span>Webinar registration</span></div></div><p class="muted">Loading…</p></main>
<script src="config.js"></script>
<script>
'use strict';
(function () {
  const cfg = window.GARUDA_CONFIG || {};
  const root = document.getElementById('reg');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  const brand = '<div class="brand"><div class="mark">G</div><div><b>Garuda Aerospace</b><span>Webinar registration</span></div></div>';
  const params = new URLSearchParams(location.search);
  const slug = params.get('w') || '';
  const fnUrl = (cfg.supabaseUrl || '').replace(/\/$/, '') + '/functions/v1/webinar';
  const headers = { 'Content-Type': 'application/json', apikey: cfg.supabaseAnonKey || '', Authorization: 'Bearer ' + (cfg.supabaseAnonKey || '') };
  const show = (html) => (root.innerHTML = brand + html);

  if (!cfg.supabaseUrl) return show('<h1>Registration page</h1><p class="muted">This page goes live once the CRM is connected to Supabase (config.js).</p>');
  if (!slug) return show('<h1>Webinar not found</h1><p class="muted">The link is missing the webinar name. Please use the full link you were sent.</p>');

  let ev = null;
  fetch(fnUrl + '?action=info&slug=' + encodeURIComponent(slug), { headers })
    .then((r) => r.json())
    .then((d) => { if (d.error) throw new Error(d.error); ev = d; form(); })
    .catch((e) => show(`<h1>Webinar not found</h1><p class="muted">${esc(e.message)}</p>`));

  function when(d) { const x = new Date(d); return x.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + ' · ' + x.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }) + ' IST'; }

  function form() {
    const qs = Array.isArray(ev.questions) ? ev.questions : [];
    const field = (id, label, input) => `<div class="field"><label for="${id}">${label}</label>${input}</div>`;
    show(`<div class="eyebrow">Live webinar</div><h1>${esc(ev.title)}</h1>
      <div class="when"><span class="chip acc">${esc(when(ev.start_at))}</span><span class="chip">Online</span>${ev.seats_left != null ? `<span class="chip ${ev.seats_left < 15 ? 'warn' : ''}">${ev.seats_left} seats left</span>` : ''}</div>
      ${ev.description ? `<p class="muted" style="margin:0">${esc(ev.description)}</p>` : ''}
      <div class="price">${ev.is_paid ? `${inr(ev.total)} <span class="faint" style="font-size:13px;font-family:var(--f-body)">(${inr(ev.fee)} + ${ev.gst_rate}% GST)</span>` : 'Free'}</div>
      ${ev.open ? `<form id="f" class="stack" novalidate>
        ${field('n', 'Full name', '<input id="n" autocomplete="name" required>')}
        ${field('e', 'Email', '<input id="e" type="email" autocomplete="email" required>')}
        ${field('p', 'Mobile number', '<input id="p" type="tel" inputmode="tel" autocomplete="tel" placeholder="10-digit mobile" required>')}
        ${field('c', 'City', '<input id="c" autocomplete="address-level2">')}
        ${ev.segment === 'CoE' ? field('col', 'College / institution', '<input id="col">') : field('ci', 'Interested in', '<select id="ci"><option>Not sure yet</option><option>Small Class drone pilot (RPC)</option><option>Medium Class (agri drones)</option><option>Train the Trainer</option></select>')}
        ${qs.map((q) => field('q_' + esc(q.key), esc(q.label), q.type === 'select' ? `<select id="q_${esc(q.key)}"><option value="">Choose</option>${(q.options || []).map((o) => `<option>${esc(o)}</option>`).join('')}</select>` : `<input id="q_${esc(q.key)}">`)).join('')}
        <label class="check"><input type="checkbox" id="ok" checked> Send me the joining link, reminders and course updates by email</label>
        ${ev.terms ? `<p class="faint" style="font-size:12px;margin:0">${esc(ev.terms)}</p>` : ''}
        <div class="err" id="err"></div>
        <button class="bigbtn" id="go" type="submit">${ev.is_paid ? 'Pay ' + inr(ev.total) + ' and register' : 'Register free'}</button>
        ${ev.is_paid ? '<p class="faint" style="font-size:12px;margin:0;text-align:center">Secure payment by Razorpay · UPI, cards and net banking</p>' : ''}
      </form>` : '<div class="note">Registrations for this webinar are closed.</div>'}`);
    const f = document.getElementById('f'); if (!f) return;
    f.onsubmit = (e) => { e.preventDefault(); submit(qs); };
  }

  async function submit(qs) {
    const g = (id) => (document.getElementById(id)?.value || '').trim();
    const err = document.getElementById('err'); const btn = document.getElementById('go');
    err.textContent = '';
    if (g('n').length < 2) return (err.textContent = 'Please enter your name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g('e'))) return (err.textContent = 'Please enter a valid email address.');
    if (g('p').replace(/\D/g, '').length < 10) return (err.textContent = 'Please enter a 10-digit mobile number.');
    const answers = {}; qs.forEach((q) => { const v = g('q_' + q.key); if (v) answers[q.key] = v; });
    const utm = {}; params.forEach((v, k) => { if (k.startsWith('utm_')) utm[k] = v; });
    btn.disabled = true; btn.textContent = 'Please wait…';
    try {
      const r = await fetch(fnUrl, { method: 'POST', headers, body: JSON.stringify({ action: 'register', slug, name: g('n'), email: g('e'), phone: g('p'), city: g('c'), college: g('col'), course_interest: g('ci'), answers, consent: document.getElementById('ok').checked, utm }) });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      if (d.status === 'Active') return done(d.already);
      await pay(d);
    } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = ev.is_paid ? 'Pay ' + inr(ev.total) + ' and register' : 'Register free'; }
  }

  function loadRazorpay() {
    return new Promise((res, rej) => { if (window.Razorpay) return res(); const s = document.createElement('script'); s.src = 'https://checkout.razorpay.com/v1/checkout.js'; s.onload = res; s.onerror = () => rej(new Error('Could not open the payment window. Check your connection and try again.')); document.head.appendChild(s); });
  }
  async function pay(d) {
    await loadRazorpay();
    const c = d.checkout;
    return new Promise((res, rej) => {
      const rz = new window.Razorpay({
        key: c.key, order_id: c.order_id, amount: c.amount, currency: c.currency, name: 'Garuda Aerospace', description: c.title,
        prefill: { name: c.name, email: c.email, contact: c.phone }, theme: { color: '#005aa9' },
        handler: async (p) => {
          try {
            const r = await fetch(fnUrl, { method: 'POST', headers, body: JSON.stringify({ action: 'verify', attendee_id: d.attendee_id, razorpay_order_id: p.razorpay_order_id, razorpay_payment_id: p.razorpay_payment_id, razorpay_signature: p.razorpay_signature }) });
            const v = await r.json(); if (v.error) throw new Error(v.error);
            done(false, p.razorpay_payment_id); res();
          } catch (e) { rej(new Error('Payment received but not yet confirmed. You will get an email shortly; if not, contact us with payment id ' + p.razorpay_payment_id)); }
        },
        modal: { ondismiss: () => rej(new Error('Payment was cancelled. Your seat is held for a short while; try again to confirm it.')) },
      });
      rz.on('payment.failed', (r) => rej(new Error('Payment failed: ' + (r.error?.description || 'please try again'))));
      rz.open();
    });
  }
  function done(already, payId) {
    show(`<div class="done"><div class="tick">✓</div><h1>${already ? 'You are already registered' : 'You are registered'}</h1>
      <p class="muted">${esc(ev.title)}<br>${esc(when(ev.start_at))}</p>
      <p>We have emailed the joining link to you. You will get reminders a day before and an hour before the webinar.</p>${payId ? `<p class="faint" style="font-size:12px">Payment id ${esc(payId)}</p>` : ''}</div>`);
  }
})();
</script>
</body>
</html>
